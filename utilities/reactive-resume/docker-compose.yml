services:
  resume-db:
    container_name: house_resume_db
    image: postgres:17
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - ./resume-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - utility-dashboard-net
    restart: unless-stopped

  reactive-resume:
    container_name: house_resume_app
    image: amruthpillai/reactive-resume:v5.3.0
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      resume-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      start_period: 60s
      start_interval: 10s
      interval: 24h
      timeout: 10s
      retries: 3
    networks:
      - utility-dashboard-net
    restart: unless-stopped

networks:
  utility-dashboard-net:
    external: true   # attach to NPM's existing network, don't create a new one
