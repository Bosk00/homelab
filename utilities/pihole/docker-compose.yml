services:
  # === NETWORK AD-BLOCKER (PI-HOLE) ===
  # Bridge networking with port mapping, per-device query stats will show
  # Docker's gateway IP rather than each device's real IP
  pihole:
    container_name: house_guard_pihole
    image: pihole/pihole:2026.07.2   #  verified current stable via GitHub releases page 2026-08-29
    security_opt:
      - no-new-privileges:true
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8053:80/tcp"   # web UI — NOT 80:80, that's reserved for NPM 
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1000M
    environment:
      - TZ=${TZ:-Etc/UTC}
      - FTLCONF_webserver_api_password=${PIHOLE_ADMIN_PASSWORD}
      - FTLCONF_dns_listeningMode=ALL   # correct mode for bridge networking, per Pi-hole's own docs
      - CHECK_VERSION=false
    volumes:
      - ./etc-pihole:/etc/pihole
    restart: unless-stopped